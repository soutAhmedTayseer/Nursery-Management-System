name: CI
on:
  pull_request:
  push:
    branches: [develop, backend-integration-with-mobile]
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Shared package dependencies
        working-directory: packages/nursery_shared
        run: flutter pub get
      - name: Shared package tests
        working-directory: packages/nursery_shared
        run: flutter test
      - name: Admin dependencies
        run: flutter pub get
      - name: Admin analysis
        run: flutter analyze
      - name: Admin tests
        run: flutter test --dart-define=USE_FAKES=true
      - name: Mobile dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Mobile analysis
        working-directory: mobile
        run: flutter analyze
      - name: Mobile tests
        working-directory: mobile
        run: flutter test
